<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- BetEA Icon Only - For App Icon/Favicon -->
  
  <!-- Outer circle with gradient -->
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A651;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008A43;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="60" cy="60" r="55" fill="url(#greenGradient)"/>
  
  <!-- Rising arrow/chevron (upward momentum) -->
  <path d="M 35 70 L 60 35 L 85 70" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 60 35 L 60 85" stroke="white" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Gold star accent (winning moment) -->
  <circle cx="78" cy="42" r="6" fill="#FFB81C"/>
  <circle cx="78" cy="42" r="3" fill="white"/>
</svg>
